name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor in pyproject.toml and docs/06; 3.12 is what the team runs.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable, as documented)
        run: python -m pip install -e .

      - name: Starter pack integrity
        run: python src/validate_pack.py

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Rules never read the current date or time
        run: |
          if grep -rnE "date\.today|datetime\.now|time\.time\(" claimguard/rules/; then
            echo "::error::A rule reads the wall clock. Use the claim's service and submission dates."
            exit 1
          fi

      - name: Evaluate our engine on every public split
        run: |
          for split in development validation stress; do
            python -m claimguard.run --strict --input data/$split/claims.jsonl --output outputs/${split}_predictions.jsonl
            python src/evaluate.py --gold data/$split/expected_results.jsonl \
              --pred outputs/${split}_predictions.jsonl --claims data/$split/claims.jsonl \
              --output outputs/${split}_metrics.json
            python -m claimguard.evaluation.summary --split $split --gold data/$split/expected_results.jsonl \
              --pred outputs/${split}_predictions.jsonl --claims data/$split/claims.jsonl \
              --manifest outputs/${split}_predictions.jsonl.manifest.json --output outputs/${split}_summary.json
          done
          python - <<'PY'
          import json, sys
          ok = True
          for split in ("development", "validation", "stress"):
              m = json.load(open(f"outputs/{split}_metrics.json"))["overall"]
              print(f"{split}: status_accuracy={m['status_accuracy']} not_implemented={m['not_implemented']} fp={m['fp']} fn={m['fn']}")
              ok = ok and m["status_accuracy"] == 1.0 and m["not_implemented"] == 0
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python }}
          path: |
            outputs/*_metrics.json
            outputs/*_summary.json
            outputs/*_predictions.jsonl.manifest.json
